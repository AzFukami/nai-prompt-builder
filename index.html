<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f17;--card:#1a1a2e;--tag:#252540;--input:#16162a;--text:#e8e8f0;--muted:#8888a8;--border:#2a2a45;--accent:#6366f1;--accent2:#4f46e5;--green:#6ee7b7;--purple:#818cf8;--red:#f87171;--orange:#f97316}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:8px;padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
input,textarea,button{font-family:inherit}
input,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:14px;outline:none}
textarea{resize:vertical}
.card{padding:10px 12px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag-btn{display:inline-flex;border-radius:5px;overflow:hidden;margin:2px}
.tag-btn button{border:none;cursor:pointer;font-size:13px;padding:6px 10px;min-height:32px}
.tag-btn .tl{background:var(--tag);color:#d0d0e0;font-weight:400}
.tag-btn .tl.on{background:var(--accent);color:#fff;font-weight:600}
.tag-btn .tw{display:flex;align-items:center;background:var(--accent2)}
.tag-btn .tw button{background:none;color:#c7d2fe;padding:0 5px;font-size:14px;font-weight:700;min-width:24px;min-height:32px}
.tag-btn .tw span{color:#e0e7ff;font-size:11px;min-width:20px;text-align:center;font-family:monospace}
.tag-btn .td{background:#dc2626;color:#fff;font-size:11px;padding:0 7px;min-height:32px;border:none;cursor:pointer}
.cat-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-height:38px}
.cat-btn.open{border-color:var(--accent);border-radius:8px 8px 0 0;background:rgba(99,102,241,0.08)}
.cat-tags{padding:8px 6px;background:var(--card);border-radius:0 0 8px 8px;border:1px solid var(--accent);border-top:none;margin-top:-1px;display:none}
.cat-tags.open{display:block}
.badge{background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600}
.sec-head{padding:8px 0 4px;font-size:14px;font-weight:700;margin-top:10px;border-top:1px solid var(--border)}
.sec-head:first-child{border-top:none;margin-top:0}
.sec-head span{font-size:11px;font-weight:400;color:var(--muted);margin-left:8px}
.out-box{padding:8px 10px;border-radius:6px;background:var(--input);border:1px solid var(--border);font-size:13px;line-height:1.6;word-break:break-all;min-height:36px;user-select:all;-webkit-user-select:all}
.pill{padding:4px 10px;border-radius:6px;border:none;font-size:12px;cursor:pointer;min-height:28px;font-weight:400;background:var(--tag);color:var(--muted)}
.pill.on{font-weight:600}
.ctrl-btn{padding:4px 10px;border-radius:6px;border:none;font-size:12px;cursor:pointer;min-height:28px}
details summary{cursor:pointer}
.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:820px;background:rgba(15,15,23,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:50}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--tag);color:#d0d0e0;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;min-height:28px}
.chip:active{background:#dc2626;color:#fff}
.chip b{color:#c7d2fe;font-weight:600;font-family:monospace;font-size:11px}
</style>

function cp(text,label){
  if(!text)return;

  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(fb)}else{fb()}
}

function h(tag,...ch){const e=document.createElement(tag);for(const c of ch){if(typeof c==="string")e.appendChild(document.createTextNode(c));else if(c)e.appendChild(c)}return e}
function ha(tag,attrs,...ch){const e=h(tag,...ch);for(const[k,v]of Object.entries(attrs)){if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v)}return e}

    w.appendChild(ha("button",{onClick:()=>{wts[tag]=Math.max(-5,(wts[tag]||0)-1);render()}},"−"));
    const s=h("span",(wts[tag]||0)>0?"+"+wts[tag]:String(wts[tag]||0));
    w.appendChild(s);
    w.appendChild(ha("button",{onClick:()=>{wts[tag]=Math.min(5,(wts[tag]||0)+1);render()}},"+"));
    d.appendChild(w);
  }

    if(c)s.push("【キャラクタープロンプト】\n"+c);
    if(n)s.push("【ネガティブプロンプト】\n"+n);
    cp(s.join("\n\n"),"all");
  }},copied==="all"?"✓ コピー済み！":"全てコピー"));
  outCard.appendChild(oHead);

  // 選択中タグ（タップで解除）
  const selKeys=Object.keys(sel).filter(t=>{
    if(nsfw)return true;
    const nsec=SECS.find(s=>s.section==="nsfw");
    return !nsec.cats.some(c=>c.tags.some(([,tt])=>tt===t))||customSets.some(cs=>cs.tags.includes(t));
  });
  if(selKeys.length>0){
    const chips=ha("div",{style:{display:"flex",flexWrap:"wrap",gap:"4px",marginBottom:"10px",paddingBottom:"10px",borderBottom:"1px solid #2a2a45"}});
    selKeys.forEach(t=>{
      const w=wts[t]||0;
      const c=ha("button",{class:"chip",title:t+"（タップで解除）",onClick:()=>{delete sel[t];delete wts[t];render()}});
      c.innerHTML=(LBL[t]||t)+(w!==0?' <b>'+(w>0?"+"+w:w)+'</b>':'')+' <span style="color:#8888a8">×</span>';
      chips.appendChild(c);
    });
    outCard.appendChild(chips);
  }

  const outBoxes={};
  [{l:"プロンプト",b:buildMain,k:"main",c:"#6ee7b7",p:"シーン系タグを選択..."},
   {l:"キャラクタープロンプト",b:buildChar,k:"char",c:"#818cf8",p:"キャラ外見タグを選択..."},
   {l:"ネガティブプロンプト",b:buildNeg,k:"neg",c:"#f87171",p:"プリセット選択..."}].forEach(({l,b,k,c,p})=>{
    const d=ha("div",{style:{marginBottom:k==="neg"?"0":"10px"}});
    const r=ha("div",{class:"row",style:{justifyContent:"space-between",marginBottom:"3px"}});
    r.appendChild(ha("span",{style:{fontSize:"12px",color:c,fontWeight:"600"}},l));
    r.appendChild(ha("button",{class:"ctrl-btn",style:{padding:"3px 10px",border:"1px solid #2a2a45",background:copied===k?"#22c55e":"transparent",color:copied===k?"#fff":"#8888a8",fontSize:"11px",minHeight:"26px",borderRadius:"5px"},onClick:()=>cp(b(),k)},copied===k?"✓":"コピー"));
    d.appendChild(r);
    const t=b();
    const ob=ha("div",{class:"out-box",style:{color:t?(k==="neg"?"#f87171":k==="char"?"#c4b5fd":"#e8e8f0"):"#555"}},t||p);
    outBoxes[k]={el:ob,b,p,k};
    d.appendChild(ob);
    outCard.appendChild(d);
  });
  app.appendChild(outCard);

  // テキスト入力→出力ボックス即時反映
  updateOut=()=>{
    Object.values(outBoxes).forEach(({el,b,p,k})=>{
      const t=b();
      el.textContent=t||p;
      el.style.color=t?(k==="neg"?"#f87171":k==="char"?"#c4b5fd":"#e8e8f0"):"#555";
    });
  };

  // Tips
  const det=h("details");det.className="card";
  det.appendChild(ha("summary",{style:{fontSize:"12px",color:"#8888a8"}},"💡 V4.5 Tips"));
  const tipD=ha("div",{style:{fontSize:"12px",color:"#8888a8",lineHeight:"1.8",marginTop:"6px"}});
  tipD.innerHTML='<p style="margin:3px 0">・<b style="color:#e8e8f0">{tag}</b> = ×1.05強調 / <b style="color:#e8e8f0">{{tag}}</b> = ×1.10 / <b style="color:#e8e8f0">[tag]</b> = 弱化</p><p style="margin:3px 0">・前方タグほど優先 / 品質タグは末尾推奨</p><p style="margin:3px 0">・マルチキャラは | で区切り</p><p style="margin:3px 0">・CFG 5〜8推奨 / ステップ 28〜50</p>';
  det.appendChild(tipD);
  app.appendChild(det);

  // 固定ボトムバー
  const bar=ha("div",{class:"fbar"});
  const nSel=Object.keys(sel).length;
  bar.appendChild(ha("span",{style:{fontSize:"13px",color:nSel>0?"#e8e8f0":"#8888a8",fontWeight:"600"}},nSel+" 選択"));
  bar.appendChild(ha("div",{style:{flex:"1"}}));
  bar.appendChild(ha("button",{class:"ctrl-btn",style:{border:"1px solid #2a2a45",background:"#1a1a2e",color:"#c7d2fe",minHeight:"36px",padding:"6px 14px",borderRadius:"8px"},onClick:()=>{document.getElementById("outcard").scrollIntoView({behavior:"smooth"})}},"📋 出力へ"));
  bar.appendChild(ha("button",{class:"ctrl-btn",style:{background:copied==="all"?"#22c55e":"#6366f1",color:"#fff",fontWeight:"600",minHeight:"36px",padding:"6px 16px",borderRadius:"8px"},onClick:()=>{
    const s=[],m=buildMain(),c=buildChar(),n=buildNeg();
    if(m)s.push("【プロンプト】\n"+m);
    if(c)s.push("【キャラクタープロンプト】\n"+c);
    if(n)s.push("【ネガティブプロンプト】\n"+n);
    cp(s.join("\n\n"),"all");
  }},copied==="all"?"✓ コピー済み":"全てコピー"));
  app.appendChild(bar);

  window.scrollTo(0,sy);
  saveState();
}

render();
</script>
</body>
</html>
